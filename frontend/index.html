
<!DOCTYPE html>
<html lang="en" ng-app="protoPlasmaApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProtoPlasma | Particle Simulation</title>

    <link rel="stylesheet" href="css/styles.css">

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>

<body ng-controller="SimController">

    <header class="topbar">
        <div>
            <h1>Proto<span>Plasma</span></h1>
            <p>Real-Time Particle Simulation</p>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            <span>Simulation Interface</span>
        </div>
    </header>

    <main class="dashboard">
        <section class="simulation-panel">
            <div class="panel-heading">
                <div>
                    <h2>Particle Field</h2>
                    <p>2D plasma environment</p>
                </div>
                <span class="live-badge">● LIVE VIEW</span>
            </div>

            <canvas id="plasmaCanvas" width="600" height="600"></canvas>

            <div class="simulation-footer">
                <span>FPS: <strong>{{ fps }}</strong></span>
                <span>Particles: <strong>{{ particleCount }}</strong></span>
                <span>Tick: <strong>{{ lastTick }}</strong></span>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
    <script src="js/services/socketService.js"></script>
    <script src="js/controller/simController.js"></script>
</body>
</html>
